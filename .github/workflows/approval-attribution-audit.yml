---
name: Audit approval attribution
on:
  push:
    branches:
      - codex/complete-approval-attribution
    paths:
      - .github/workflows/approval-attribution-audit.yml
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --locked --no-build --no-install-project --no-python-downloads --python 3.14
      - name: Replay the published approval snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-build --no-sync python - <<'PY'
          import json
          import os
          from src.approval_leaderboard import _is_approval_command, _rest_items
          from src.updater import RateLimiter, create_github_session

          repository = os.environ['GITHUB_REPOSITORY']
          base = f'https://api.github.com/repos/{repository}/issues'
          limiter = RateLimiter(4)
          with create_github_session() as session:
              for number in (6591, 9393):
                  response = session.get(f'{base}/{number}', timeout=15)
                  response.raise_for_status()
                  issue = response.json()
                  records = []
                  for item in _rest_items(session, f'{base}/{number}/timeline', limiter):
                      kind = item['event']
                      label = (item.get('label') or {}).get('name', '')
                      actor = (item.get('actor') or item.get('user') or {}).get('login')
                      command = kind == 'commented' and _is_approval_command(item.get('body') or '')
                      if not command and kind not in ('closed','reopened') and not label.startswith('approve'):
                          continue
                      records.append({'event': kind, 'label': label, 'actor': actor,
                                      'created': item.get('created_at'), 'approval_command': command,
                                      'thumbs_up': (item.get('reactions') or {}).get('+1')})
                  print('Approval exception audit ' + json.dumps({
                      'issue': number, 'author': issue['user']['login'], 'closed': issue['closed_at'],
                      'events': records,
                  }), flush=True)
          PY
